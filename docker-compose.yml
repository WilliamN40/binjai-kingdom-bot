# Two containers, both on their own, with no published ports:
#
#   bot      talks to Telegram and Claude, records groups, holds the secrets.
#   sandbox  runs the secretary's shell commands. No secrets, read-only system,
#            one unprivileged Linux user per group, and a firewall that allows
#            only the public internet (not the host, other containers, the
#            local network or the cloud metadata service).
#
# They share only a unix socket (commands in, output back) and the groups'
# record, which the sandbox can read but not change.
name: binjaibot

services:
  bot:
    build: .
    image: binjaibot:latest
    container_name: binjaibot
    restart: unless-stopped
    init: true
    # On stop or redeploy the bot finishes the answers it is working on first.
    stop_grace_period: 3m
    depends_on:
      - sandbox
    env_file: .env
    environment:
      DATA_DIR: /data
      WORKSPACE_DIR: /data/workspace
      BOT_MODE: prod
      SANDBOX_SOCKET: /run/sandbox/runner.sock
      # Keep Claude Code's settings file inside the persisted volume below
      CLAUDE_CONFIG_DIR: /home/node/.claude
    volumes:
      # Transcripts, notes, schedules and bot state: plain files on the host.
      - ./data:/data
      # Claude Code's own state (private-chat sessions).
      - claude-home:/home/node/.claude
      - sandbox-socket:/run/sandbox
    # Each answer in progress is a separate Claude process of roughly 200 MB.
    mem_limit: 4g
    cpus: 2
    pids_limit: 1024
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  sandbox:
    build: ./sandbox
    image: binjaibot-sandbox:latest
    container_name: binjaibot-sandbox
    restart: unless-stopped
    init: true
    # Its own network, shared with nothing. The runner installs an egress firewall
    # at startup and refuses to run without it. For a sandbox with no network at
    # all, replace `networks` with `network_mode: none` and drop NET_ADMIN.
    networks:
      - sandbox-net
    read_only: true
    environment:
      TZ: ${SECRETARY_TIMEZONE:-Asia/Singapore}
      SANDBOX_QUOTA_MB: ${SANDBOX_QUOTA_MB:-1024}
      # Optional: a GitHub token the groups' scripts may use. Everyone who can ask the
      # secretary to run commands can use it, so scope it to what they may already do.
      SANDBOX_GITHUB_TOKEN: ${SANDBOX_GITHUB_TOKEN:-}
    volumes:
      - sandbox-socket:/run/sandbox
      # Each group's workspace (files the secretary creates).
      - ./data/sandbox:/work
      # The groups' record. Group folders are closed to every sandbox user except their own.
      - ./data/groups:/record
    tmpfs:
      - /dev/shm:size=1m,mode=0700
      # iptables keeps its lock file here
      - /run:size=1m,mode=0755
    # The runner starts as root only to set the firewall and to switch each command
    # to its group's user. These capabilities are all it has; commands get none.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - KILL
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    logging: *logging

networks:
  sandbox-net:
    driver: bridge

volumes:
  claude-home:
  sandbox-socket:
